
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaClass ADMIN FINAL WORKING</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--primary:#16a34a;--bg:#f8fafb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#eef2f7;--danger:#ef4444}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
#loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);transition:opacity .4s}
#loader.hide{opacity:0;pointer-events:none}
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:90}
.auth-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px}
.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;outline:none;margin-bottom:8px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:600;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.top{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:30}
.side{position:fixed;left:0;top:56px;bottom:0;width:250px;background:#fff;border-right:1px solid var(--border);padding:10px;overflow-y:auto}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:2px;text-align:left}
.nav-btn.active{background:var(--text);color:#fff}
.nav-btn .count{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px}
.main{margin-left:250px;padding:20px;padding-top:76px;min-height:100vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#fff}
.tab{display:none}.tab.active{display:block}
.week{display:flex;gap:2px;background:#65D78E;padding:4px;border-radius:10px;margin:12px 0}
.week button{flex:1;border:none;background:transparent;color:#fff;font-weight:700;padding:8px;border-radius:8px;cursor:pointer}
.week button.active{background:#fff;color:#0f172a}
</style>
</head>
<body>
<div id="loader"><div style="text-align:center"><div style="width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px">N</div><div style="font-weight:800;font-size:24px;margin-top:10px">NovaClass</div><div id="loaderText" style="font-size:12px;margin-top:4px">Загрузка...</div><div style="margin-top:12px;width:140px;height:3px;background:rgba(255,255,255,.3);border-radius:10px"><div id="loadBar" style="height:100%;width:0%;background:#fff;transition:width .3s"></div></div></div></div>

<div id="auth" class="auth" style="display:none"><div class="auth-card"><div style="text-align:center"><div style="width:48px;height:48px;background:var(--primary);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;margin:0 auto">N</div><div style="font-weight:800;margin-top:10px">NovaClass Admin</div></div><input id="email" class="input" placeholder="Email" style="margin-top:14px"><input id="pass" class="input" type="password" placeholder="Пароль"><button class="btn primary" style="width:100%" onclick="login()">Войти</button><div id="authErr" style="color:var(--danger);font-size:12px;margin-top:8px;display:none"></div></div></div>

<div id="app" style="display:none">
<div class="top"><div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;background:var(--primary);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800">N</div><b>NovaClass</b><span style="font-size:10px;background:#dcfce7;color:#16a34a;padding:3px 8px;border-radius:20px">FINAL WORKING</span><span id="apiDot" style="width:8px;height:8px;border-radius:50%;background:#ccc;margin-left:8px"></span></div><div style="display:flex;gap:6px"><button class="btn" onclick="init()">Обновить</button><button class="btn" onclick="logout()">Выйти</button></div></div>
<div class="side">
<button class="nav-btn active" data-t="dash" onclick="tab('dash')">Дашборд</button>
<button class="nav-btn" data-t="users" onclick="tab('users')">Пользователи <span id="c-users" class="count">0</span></button>
<button class="nav-btn" data-t="messages" onclick="tab('messages')">Все СМС чата <span id="c-msg" class="count">0</span></button>
<button class="nav-btn" data-t="complaints" onclick="tab('complaints')">Жалобы на СМС <span id="c-comp" class="count" style="display:none">0</span></button>
<button class="nav-btn" data-t="appeals" onclick="tab('appeals')">Апелляции/Баги <span id="c-appeal" class="count" style="display:none">0</span></button>
<button class="nav-btn" data-t="sched" onclick="tab('sched')">Расписание</button>
<button class="nav-btn" data-t="hw" onclick="tab('hw')">Домашка</button>
<button class="nav-btn" data-t="banner" onclick="tab('banner')">Баннер + Контроль</button>
</div>
<div class="main">
<div id="p-dash" class="tab active"></div>
<div id="p-users" class="tab"></div>
<div id="p-messages" class="tab"></div>
<div id="p-complaints" class="tab"></div>
<div id="p-appeals" class="tab"></div>
<div id="p-sched" class="tab"></div>
<div id="p-hw" class="tab"></div>
<div id="p-banner" class="tab"></div>
</div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbzIHwTxKCJUpZUuqJd0-QHJ-tjTx3CCIDEyvzpZVCxYWkcYprY1Wp723J5jP9s_PA/exec';
const ADMIN_EMAIL='maksimsuhomlinov37@gmail.com';
let DATA={users:[],schedule:[],homework:[],messages:[],banner:[],siteControl:{maintenance:false,primaryColor:'#16a34a'},complaints:[],appeals:[]};
let activeDay='Понедельник';
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];

function apiGet(p){return fetch(API_URL+'?'+new URLSearchParams(p),{cache:'no-store',signal:AbortSignal.timeout(8000)}).then(r=>r.json())}
function apiPost(d){return fetch(API_URL,{method:'POST',body:JSON.stringify(d)}).then(r=>r.json())}
function setLoad(p){const el=document.getElementById('loadBar'); if(el) el.style.width=p+'%';}
function login(){const e=document.getElementById('email').value.trim().toLowerCase();const p=document.getElementById('pass').value.trim();if(e===ADMIN_EMAIL && p==='Suxmaks_12'){sessionStorage.setItem('nc_admin','1');document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';init();}else{const err=document.getElementById('authErr');err.style.display='block';err.textContent='Неверный логин';}}
function logout(){sessionStorage.removeItem('nc_admin');location.reload();}
function tab(t){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id==='p-'+t)); if(t==='dash') renderDash(); if(t==='users') renderUsers(); if(t==='messages') renderMessages(); if(t==='complaints') renderComplaints(); if(t==='appeals') renderAppeals(); if(t==='sched') renderSched(); if(t==='hw') renderHw(); if(t==='banner') renderBanner();}

async function init(){
  setLoad(20);
  try{
    const d=await apiGet({action:'getAllData',t:Date.now()});
    setLoad(70);
    if(d.status==='ok'){
      DATA.users=d.users||[]; DATA.schedule=d.schedule||[]; DATA.homework=d.homework||[]; DATA.messages=d.messages||[]; DATA.banner=d.banner||[]; DATA.complaints=d.complaints||[]; DATA.appeals=d.appeals||[]; DATA.siteControl=d.siteControl||{maintenance:false,primaryColor:'#16a34a'};
      document.getElementById('apiDot').style.background='#22c55e';
      updateCounts(); renderDash(); renderUsers(); renderSched(); renderHw(); renderBanner();
      try{ localStorage.setItem('nc_admin_cache', JSON.stringify(DATA)); }catch{}
    }
    setLoad(100);
  }catch(e){
    console.error(e);
    document.getElementById('apiDot').style.background='#ef4444';
    try{ const cached=JSON.parse(localStorage.getItem('nc_admin_cache')||'{}'); if(cached.users){ DATA=cached; updateCounts(); renderDash(); } }catch{}
  } finally {
    setTimeout(()=>{document.getElementById('loader').classList.add('hide');},400);
  }
}

function updateCounts(){
  document.getElementById('c-users').textContent=DATA.users.length;
  document.getElementById('c-msg').textContent=DATA.messages.length;
  const nc=DATA.complaints.filter(c=>c.status==='new').length; const el1=document.getElementById('c-comp'); el1.textContent=nc; el1.style.display=nc?'inline':'none';
  const na=DATA.appeals.filter(c=>c.status==='new').length; const el2=document.getElementById('c-appeal'); el2.textContent=na; el2.style.display=na?'inline':'none';
}

function renderDash(){
  document.getElementById('p-dash').innerHTML=`<div class="card" style="background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff"><div style="font-size:20px;font-weight:800">Панель управления NovaClass</div><div style="opacity:.9;font-size:13px">Пользователей: ${DATA.users.length} | СМС: ${DATA.messages.length} | Жалоб: ${DATA.complaints.length} | Апелляций: ${DATA.appeals.length}</div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div class="card"><div style="font-size:12px;color:var(--muted)">Пользователи</div><div style="font-size:24px;font-weight:800">${DATA.users.length}</div></div><div class="card"><div style="font-size:12px;color:var(--muted)">СМС</div><div style="font-size:24px;font-weight:800">${DATA.messages.length}</div></div><div class="card"><div style="font-size:12px;color:var(--muted)">Жалобы new</div><div style="font-size:24px;font-weight:800">${DATA.complaints.filter(c=>c.status==='new').length}</div></div><div class="card"><div style="font-size:12px;color:var(--muted)">Апелляции new</div><div style="font-size:24px;font-weight:800">${DATA.appeals.filter(c=>c.status==='new').length}</div></div></div>`;
}

function renderUsers(){
  document.getElementById('p-users').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Пользователи ${DATA.users.length}</b><input id="uSearch" class="input" placeholder="поиск по имени/email" style="max-width:200px" oninput="renderUsersList()"></div><div id="uList" style="margin-top:12px"></div></div>`; renderUsersList();
}
function renderUsersList(){
  const q=(document.getElementById('uSearch')?.value||'').toLowerCase();
  const list=DATA.users.filter(u=>(u.name+' '+u.email).toLowerCase().includes(q));
  document.getElementById('uList').innerHTML=list.map(u=>`<div class="row"><div><b>${u.name}</b><div style="font-size:11px;color:var(--muted)">${u.email} | ${u.id} | ${u.role}</div></div><div style="display:flex;gap:6px"><select class="input" style="width:110px;margin:0" onchange="changeRole('${u.id}',this.value)"><option ${u.role==='ученик'?'selected':''}>ученик</option><option ${u.role==='учитель'?'selected':''}>учитель</option><option ${u.role==='админ'?'selected':''}>админ</option></select><button class="btn" style="color:var(--danger)" onclick="delUser('${u.id}')">Удалить</button></div></div>`).join('')||'<div style="text-align:center;color:var(--muted);padding:20px">Нет пользователей</div>';
}
async function changeRole(id,role){const u=DATA.users.find(x=>x.id==id); await apiPost({action:'update_user',id,role,name:u.name,email:u.email}); u.role=role;}
async function delUser(id){if(!confirm('Удалить?'))return; await apiPost({action:'delete_user',id}); DATA.users=DATA.users.filter(x=>x.id!=id); renderUsers(); updateCounts();}

function renderMessages(){
  document.getElementById('p-messages').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Все СМС чата - ${DATA.messages.length}</b><button class="btn" style="color:var(--danger)" onclick="clearChat()">Очистить все</button></div><div style="margin-top:12px">${DATA.messages.slice().reverse().map(m=>`<div class="row"><div style="flex:1"><b>${m.user}</b> <span style="font-size:11px;color:var(--muted)">${m.email} | ${new Date(m.createdAt).toLocaleString()}</span><div style="margin-top:6px;background:#f8fafb;padding:8px;border-radius:8px;font-size:13px;white-space:pre-wrap">${m.text}</div><div style="font-size:10px;color:var(--muted)">ID: ${m.id}</div></div><button class="btn" style="color:var(--danger)" onclick="deleteMsg('${m.id}')">Удалить</button></div>`).join('')||'пусто'}</div></div>`;
}
async function deleteMsg(id){if(!confirm('Удалить СМС?'))return; await apiPost({action:'delete_message',id}); DATA.messages=DATA.messages.filter(m=>m.id!=id); renderMessages(); updateCounts();}
async function clearChat(){if(!confirm('Очистить весь чат?'))return; await apiPost({action:'clear_chat'}); DATA.messages=[]; renderMessages(); updateCounts();}

function renderComplaints(){
  document.getElementById('p-complaints').innerHTML=`<div class="card"><b>Жалобы на СМС - ${DATA.complaints.length}</b><div style="margin-top:12px">${DATA.complaints.slice().reverse().map(c=>{const orig=DATA.messages.find(m=>m.id==c.targetId); return `<div class="row" style="border-left:4px solid ${c.status==='new'?'orange':'var(--primary)'}"><div style="flex:1"><div><span style="font-size:11px;padding:2px 6px;border-radius:10px;background:#fef3c7">${c.status}</span> <b>${c.type}</b> от ${c.from} <span style="font-size:11px">${new Date(c.createdAt).toLocaleString()}</span></div><div style="margin-top:6px"><b>Жалоба:</b> ${c.text}</div>${orig?`<div style="margin-top:6px;background:#fef2f2;padding:8px;border-radius:8px"><b>Оригинал СМС:</b> ${orig.text}<br><span style="font-size:11px">${orig.user} (${orig.email})</span></div>`:`<div style="font-size:11px;color:var(--danger)">Оригинал не найден ID:${c.targetId}</div>`}<div style="font-size:11px;color:var(--muted)">Reporter: ${c.reporterEmail}</div></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn primary" onclick="updateComp('${c.id}','done')">Решено</button><button class="btn" onclick="updateComp('${c.id}','ignored')">Игнор</button><button class="btn" style="color:var(--danger)" onclick="deleteComp('${c.id}')">Удалить</button>${orig?`<button class="btn" style="color:var(--danger)" onclick="deleteMsg('${orig.id}')">Удалить СМС</button>`:''}</div></div>`}).join('')||'нет жалоб'}</div></div>`;
}
async function updateComp(id,status){await apiPost({action:'update_complaint_status',id,status}); let c=DATA.complaints.find(x=>x.id==id); if(c) c.status=status; renderComplaints(); updateCounts();}
async function deleteComp(id){await apiPost({action:'delete_complaint',id}); DATA.complaints=DATA.complaints.filter(x=>x.id!=id); renderComplaints(); updateCounts();}

function renderAppeals(){
  document.getElementById('p-appeals').innerHTML=`<div class="card"><b>Апелляции / Баги - ${DATA.appeals.length}</b><div style="margin-top:12px">${DATA.appeals.slice().reverse().map(a=>`<div class="row" style="border-left:4px solid ${a.status==='new'?'orange':'var(--primary)'}"><div style="flex:1"><div><span style="font-size:11px;padding:2px 6px;border-radius:10px;background:#fef3c7">${a.status}</span> <b>${a.type}</b> от ${a.from} <span style="font-size:11px">${new Date(a.createdAt).toLocaleString()}</span></div><div style="margin-top:6px;background:#f8fafb;padding:8px;border-radius:8px;white-space:pre-wrap">${a.text}</div>${a.adminNote?`<div style="font-size:12px;color:var(--muted);margin-top:4px">Ответ: ${a.adminNote}</div>`:''}</div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn primary" onclick="updateAppeal('${a.id}','done')">Решено</button><button class="btn" onclick="answerAppeal('${a.id}')">Ответить</button><button class="btn" style="color:var(--danger)" onclick="deleteAppeal('${a.id}')">Удалить</button></div></div>`).join('')||'нет апелляций'}</div></div>`;
}
async function updateAppeal(id,status,note){await apiPost({action:'update_appeal_status',id,status,adminNote:note||''}); let a=DATA.appeals.find(x=>x.id==id); if(a){a.status=status; if(note) a.adminNote=note;} renderAppeals(); updateCounts();}
async function deleteAppeal(id){await apiPost({action:'delete_appeal',id}); DATA.appeals=DATA.appeals.filter(x=>x.id!=id); renderAppeals(); updateCounts();}
function answerAppeal(id){const note=prompt('Ответ админа:'); if(note!==null) updateAppeal(id,'done',note);}

function renderSched(){
  document.getElementById('p-sched').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Расписание - ${activeDay}</b><button class="btn primary" onclick="openSched()">+ Урок</button></div><div class="week">${DAYS.map(d=>`<button class="${d===activeDay?'active':''}" onclick="activeDay='${d}';renderSched()">${d.slice(0,2)}</button>`).join('')}</div><div>${DATA.schedule.filter(s=>s.day===activeDay).map(s=>`<div class="row"><div><b>${s.time} - ${s.subject}</b><div style="font-size:12px;color:var(--muted)">${s.teacher||''} ${s.room?'• '+s.room:''} ${s.date?'• '+s.date:''}</div></div><div style="display:flex;gap:6px"><button class="btn" onclick="openSched('${s.id}')">Изм</button><button class="btn" style="color:var(--danger)" onclick="delSched('${s.id}')">✕</button></div></div>`).join('')||'<div style="padding:16px;text-align:center;color:var(--muted)">Нет уроков на этот день</div>'}</div></div>`;
}
function openSched(id){
  const s=id?DATA.schedule.find(x=>x.id==id):null;
  const html=`<h3>${s?'Редактировать':'Новый урок'}</h3><select id="f_day" class="input">${DAYS.map(d=>`<option ${d===(s?.day||activeDay)?'selected':''}>${d}</option>`).join('')}</select><input id="f_date" class="input" type="date" value="${s?.date||''}"><input id="f_time" class="input" placeholder="08:00 - 08:45" value="${s?.time||''}"><input id="f_subj" class="input" placeholder="Предмет" value="${s?.subject||''}"><input id="f_teacher" class="input" placeholder="Учитель" value="${s?.teacher||''}"><input id="f_room" class="input" placeholder="Кабинет" value="${s?.room||''}"><button class="btn primary" style="width:100%" onclick="saveSched('${s?.id||''}')">Сохранить</button>`;
  showModal(html);
}
async function saveSched(id){const o={id:id||Date.now().toString(),day:document.getElementById('f_day').value,date:document.getElementById('f_date').value,time:document.getElementById('f_time').value.trim(),subject:document.getElementById('f_subj').value.trim(),teacher:document.getElementById('f_teacher').value.trim(),room:document.getElementById('f_room').value.trim()}; if(!o.subject||!o.time){alert('Заполни время и предмет');return;} await apiPost({action:'save_schedule',schedule:o}); const i=DATA.schedule.findIndex(x=>x.id==o.id); if(i>=0) DATA.schedule[i]=o; else DATA.schedule.push(o); closeModal(); renderSched();}
async function delSched(id){if(!confirm('Удалить?'))return; await apiPost({action:'delete_schedule',id}); DATA.schedule=DATA.schedule.filter(x=>x.id!=id); renderSched();}

function renderHw(){
  document.getElementById('p-hw').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Домашка - ${activeDay}</b><button class="btn primary" onclick="openHw()">+ Задание</button></div><div class="week">${DAYS.map(d=>`<button class="${d===activeDay?'active':''}" onclick="activeDay='${d}';renderHw()">${d.slice(0,2)}</button>`).join('')}</div><div style="margin-top:12px">${DATA.homework.filter(h=>h.day===activeDay).map(h=>`<div class="row"><div><b>${h.subject}</b><div style="font-size:13px">${h.task}</div><div style="font-size:11px;color:var(--muted)">${h.deadline||''} ${h.date?'• '+h.date:''}</div></div><div style="display:flex;gap:6px"><button class="btn" onclick="openHw('${h.id}')">Изм</button><button class="btn" style="color:var(--danger)" onclick="delHw('${h.id}')">✕</button></div></div>`).join('')||'<div style="padding:16px;text-align:center;color:var(--muted)">Нет заданий</div>'}</div></div>`;
}
function openHw(id){const h=id?DATA.homework.find(x=>x.id==id):null; const html=`<h3>${h?'Редактировать':'Новое ДЗ'}</h3><select id="h_day" class="input">${DAYS.map(d=>`<option ${d===(h?.day||activeDay)?'selected':''}>${d}</option>`).join('')}</select><input id="h_date" class="input" type="date" value="${h?.date||''}"><input id="h_subj" class="input" placeholder="Предмет" value="${h?.subject||''}"><textarea id="h_task" class="input" style="min-height:80px" placeholder="Задание">${h?.task||''}</textarea><input id="h_dead" class="input" placeholder="Дедлайн" value="${h?.deadline||''}"><button class="btn primary" style="width:100%" onclick="saveHw('${h?.id||''}')">Сохранить</button>`; showModal(html);}
async function saveHw(id){const o={id:id||Date.now().toString(),day:document.getElementById('h_day').value,date:document.getElementById('h_date').value,subject:document.getElementById('h_subj').value.trim(),task:document.getElementById('h_task').value.trim(),deadline:document.getElementById('h_dead').value.trim()}; if(!o.subject||!o.task){alert('Заполни');return;} await apiPost({action:'save_homework',homework:o}); const i=DATA.homework.findIndex(x=>x.id==o.id); if(i>=0) DATA.homework[i]=o; else DATA.homework.push(o); closeModal(); renderHw();}
async function delHw(id){if(!confirm('Удалить?'))return; await apiPost({action:'delete_homework',id}); DATA.homework=DATA.homework.filter(x=>x.id!=id); renderHw();}

function renderBanner(){
  const b=(DATA.banner&&DATA.banner[0])||{title:'NovaClass',sub:'Добро пожаловать',btnText:'Начать',image:'',bgFrom:'#16a34a',bgTo:'#22c55e',enabled:true};
  const sc=DATA.siteControl||{};
  document.getElementById('p-banner').innerHTML=`<div class="card" style="background:linear-gradient(135deg,${b.bgFrom},${b.bgTo});color:#fff"><div style="font-size:20px;font-weight:800">${b.title}</div><div style="opacity:.9">${b.sub||''}</div></div>
  <div class="card"><b>Баннер</b><div style="display:grid;gap:8px;margin-top:10px"><input id="b_title" class="input" placeholder="Заголовок" value="${b.title||''}"><input id="b_sub" class="input" placeholder="Подзаголовок" value="${b.sub||''}"><input id="b_btn" class="input" placeholder="Кнопка" value="${b.btnText||''}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="b_c1" type="color" class="input" value="${b.bgFrom||'#16a34a'}"><input id="b_c2" type="color" class="input" value="${b.bgTo||'#22c55e'}"></div><label><input id="b_en" type="checkbox" ${b.enabled!==false?'checked':''}> Показывать</label><button class="btn primary" onclick="saveBanner()">Сохранить баннер</button></div></div>
  <div class="card"><b>Управление сайтом</b><div style="margin-top:10px"><label style="display:flex;gap:8px"><input id="maint" type="checkbox" ${sc.maintenance?'checked':''} onchange="toggleMaint()"> Техобслуживание</label><div style="margin-top:10px;display:flex;gap:8px"><input id="mainColor" type="color" value="${sc.primaryColor||'#16a34a'}" class="input" style="width:60px"><button class="btn primary" onclick="saveColor()">Цвет</button></div></div></div>
  <div class="card"><b>Рассылка всем ${DATA.users.length}</b><textarea id="bc_text" class="input" style="min-height:80px" placeholder="Сообщение всем..."></textarea><button class="btn primary" onclick="broadcast()">Отправить всем</button></div>`;
}
async function saveBanner(){const o={title:document.getElementById('b_title').value,sub:document.getElementById('b_sub').value,btnText:document.getElementById('b_btn').value,bgFrom:document.getElementById('b_c1').value,bgTo:document.getElementById('b_c2').value,enabled:document.getElementById('b_en').checked}; await apiPost({action:'save_banner',banner:o}); DATA.banner=[o]; renderBanner(); alert('Сохранено');}
async function toggleMaint(){const v=document.getElementById('maint').checked; await apiPost({action:'save_settings',settings:{maintenance:v}}); DATA.siteControl.maintenance=v;}
async function saveColor(){const c=document.getElementById('mainColor').value; await apiPost({action:'save_settings',settings:{primaryColor:c}}); DATA.siteControl.primaryColor=c; alert('Цвет: '+c);}
async function broadcast(){const t=document.getElementById('bc_text').value.trim(); if(!t) return; if(!confirm('Отправить всем '+DATA.users.length+'?'))return; await apiPost({action:'broadcast_message',text:t}); alert('Отправлено'); document.getElementById('bc_text').value='';}

function showModal(html){let m=document.getElementById('modal'); if(!m){m=document.createElement('div'); m.id='modal'; m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px'; m.innerHTML='<div id="modalBody" style="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px"></div>'; m.onclick=(e)=>{if(e.target===m) closeModal();}; document.body.appendChild(m);} document.getElementById('modalBody').innerHTML=html; m.style.display='flex';}
function closeModal(){const m=document.getElementById('modal'); if(m) m.style.display='none';}

setTimeout(()=>{if(sessionStorage.getItem('nc_admin')){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';init();}else{document.getElementById('auth').style.display='flex';document.getElementById('loader').classList.add('hide');}},500);
</script>
</body>
</html>
