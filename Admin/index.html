
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaClass Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style id="welcomeLoaderCSS">
#loader{position:fixed;inset:0;z-index:9999;background:#16a34a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
.welcome-title{font-family:'Inter',sans-serif;font-weight:800;font-size:44px;color:#fff;letter-spacing:-1.2px;line-height:1;animation:wIn .6s ease both}
.welcome-sub{font-family:'Inter',sans-serif;font-weight:500;font-size:16px;color:rgba(255,255,255,.9);margin-top:14px;animation:wIn .6s ease .15s both}
@keyframes wIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.win-loader{margin-top:36px;width:60px;height:60px;position:relative}
.win-loader-dot{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;top:50%;left:50%;margin:-3px 0 0 -3px;animation:winDot 1.2s linear infinite}
.win-loader-dot:nth-child(1){--r:0deg;animation-delay:0s}
.win-loader-dot:nth-child(2){--r:45deg;animation-delay:0.1s}
.win-loader-dot:nth-child(3){--r:90deg;animation-delay:0.2s}
.win-loader-dot:nth-child(4){--r:135deg;animation-delay:0.3s}
.win-loader-dot:nth-child(5){--r:180deg;animation-delay:0.4s}
.win-loader-dot:nth-child(6){--r:225deg;animation-delay:0.5s}
.win-loader-dot:nth-child(7){--r:270deg;animation-delay:0.6s}
.win-loader-dot:nth-child(8){--r:315deg;animation-delay:0.7s}
@keyframes winDot{0%,100%{opacity:1;transform:rotate(var(--r)) translate(22px) scale(1)}50%{opacity:.35;transform:rotate(var(--r)) translate(22px) scale(.7)}}
</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--green:#16a34a;--bg:#f8fafb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0}
body.dark{--bg:#0f1115;--card:#1a1d23;--text:#f1f5f9;--muted:#94a3b8;--border:#2a2f3a}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.top{position:fixed;top:0;left:0;right:0;height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
.burger{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.layout{display:flex;min-height:100vh;padding-top:60px}
.side{position:fixed;left:0;top:60px;bottom:0;width:280px;background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto;z-index:30;transition:transform .25s;transform:translateX(0)}
.side.open{transform:translateX(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:25;display:none}.overlay.show{display:block}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;text-align:left}.nav-btn.active{background:var(--bg);color:var(--text);font-weight:600}
.main{margin-left:280px;flex:1;min-width:0;max-width:calc(100% - 280px);padding:20px 24px 100px 24px;width:calc(100% - 280px);box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;align-items:center;background:var(--card)}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-weight:600;cursor:pointer;font-size:13px}.btn.primary{background:#16a34a;color:#fff;border-color:#16a34a}
.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);outline:none}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.role-head{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.badge{padding:3px 8px;border-radius:100px;font-size:10px;font-weight:800}.b-student{background:#f1f5f9;color:#475569}.b-admin{background:#fef3c7;color:#92400e}.b-moderator{background:#dcfce7;color:#166534}
@media (max-width:1100px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.side{transform:translateX(-100%);width:300px}.side.open{transform:translateX(0)}.main{margin-left:0;max-width:100%;width:100%;padding:16px}.burger-adaptive{display:flex!important}}
@media (min-width:901px){.burger-adaptive{display:none!important}.overlay{display:none!important}}
</style>
</head>
<body>

<div id="loader">
  <div class="welcome-title">Добро пожаловать</div>
  <div class="welcome-sub">загрузка админки</div>
  <div class="win-loader">
    <div class="win-loader-dot"></div><div class="win-loader-dot"></div><div class="win-loader-dot"></div><div class="win-loader-dot"></div>
    <div class="win-loader-dot"></div><div class="win-loader-dot"></div><div class="win-loader-dot"></div><div class="win-loader-dot"></div>
  </div>
</div>

<div class="top">
  <div style="display:flex;align-items:center;gap:10px"><button class="burger burger-adaptive" onclick="toggleSide()"><i data-lucide="menu" style="width:20px;height:20px"></i></button><div style="width:32px;height:32px;border-radius:8px;background:#16a34a;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800">N</div><div style="font-weight:800">NovaClass Admin</div></div>
  <div style="display:flex;gap:8px"><button class="burger" onclick="toggleTheme()"><i data-lucide="moon" style="width:18px;height:18px"></i></button><button class="burger" onclick="loadData()">↻</button></div>
</div>
<div class="overlay" id="overlay" onclick="toggleSide()"></div>
<div class="layout">
  <aside class="side" id="side"><div id="nav"></div></aside>
  <main class="main"><div id="page" style="width:100%;max-width:1000px;margin:0 auto"></div></main>
</div>

<div id="modalSched" style="position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px"><div class="card" style="width:100%;max-width:400px"><h3 style="font-weight:700;margin-bottom:12px">Добавить урок</h3><div style="display:grid;gap:8px"><select id="mDay" class="input"></select><input id="mTime" class="input" placeholder="08:00 — 08:45"><input id="mSubj" class="input" placeholder="Предмет"><input id="mTeacher" class="input" placeholder="Учитель"><input id="mRoom" class="input" placeholder="Кабинет"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="document.getElementById('modalSched').style.display='none'">Отмена</button><button class="btn primary" style="flex:1" onclick="addSched()">Сохранить</button></div></div></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzIHwTxKCJUpZUuqJd0-QHJ-tjTx3CCIDEyvzpZVCxYWkcYprY1Wp723J5jP9s_PA/exec';
const $=id=>document.getElementById(id);
let currentTab='home', activeDay='Понедельник', users=[], schedule=[], homework=[], messages=[], sideOpen=false;
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница'];
function toggleSide(){sideOpen=!sideOpen; $('side').classList.toggle('open',sideOpen); $('overlay').classList.toggle('show',sideOpen);}
function toggleTheme(){document.body.classList.toggle('dark'); localStorage.setItem('theme_admin',document.body.classList.contains('dark')?'dark':'light');}
if(localStorage.getItem('theme_admin')==='dark') document.body.classList.add('dark');
function showLoader(){const l=$('loader'); if(l){l.style.display='flex'; l.classList.remove('hide');}}
function hideLoader(){const l=$('loader'); if(l){l.classList.add('hide'); setTimeout(()=>l.style.display='none',500);}}
class Api{
  async get(a,p={}){let qs=new URLSearchParams(Object.assign({action:a},p)).toString(); let r=await fetch(GAS_URL+'?'+qs); let j=await r.json(); return j;}
  async post(d){let r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}); let j=await r.json(); return j;}
}
const api=new Api();
async function loadData(){
  const start=Date.now(); const MIN=2000; showLoader();
  try{
    const d=await api.get('getAllData',{chat:'общий'});
    users=d.users||[]; schedule=d.schedule||[]; homework=d.homework||[]; messages=d.messages||[];
  }catch(e){}
  const elapsed=Date.now()-start; const wait=Math.max(0,MIN-elapsed);
  setTimeout(()=>{renderNav(); renderPage(); hideLoader();},wait);
}
function renderNav(){
  const tabs=[{id:'home',label:'Главная',icon:'layout-dashboard'},{id:'users',label:'Пользователи',icon:'users'},{id:'schedule',label:'Расписание',icon:'calendar'},{id:'homework',label:'Домашние задания',icon:'book'},{id:'chat',label:'Чат',icon:'message-circle'}];
  $('nav').innerHTML=tabs.map(t=>`<button class="nav-btn ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')"><i data-lucide="${t.icon}" style="width:18px;height:18px"></i>${t.label}</button>`).join('');
  if(window.lucide) lucide.createIcons();
}
window.switchTab=(id)=>{currentTab=id; if(window.innerWidth<=900&&sideOpen) toggleSide(); renderNav(); renderPage();};
function renderPage(){
  const page=$('page'); page.innerHTML=''; const wrap=document.createElement('div');
  if(currentTab==='home'){
    wrap.innerHTML=`<div class="stats-grid">
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:800">${schedule.length}</div><div style="font-size:11px;color:var(--muted)">ЗАНЯТИЙ</div></div>
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:800">${homework.length}</div><div style="font-size:11px;color:var(--muted)">ДОМАШЕК</div></div>
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:800">${users.length}</div><div style="font-size:11px;color:var(--muted)">ПОЛЬЗОВАТЕЛЕЙ</div></div>
      <div class="card" style="text-align:center"><div style="font-size:22px;font-weight:800">${messages.length}</div><div style="font-size:11px;color:var(--muted)">СООБЩЕНИЙ</div></div>
    </div>
    <div class="card" style="margin-top:12px"><div style="font-weight:700;margin-bottom:8px">Последний раз</div>${users.slice(0,10).map(u=>`<div class="row"><div><div style="font-weight:600">${u.name}</div><div style="font-size:11px;color:var(--muted)">${u.email} • ${u.role}</div></div><div style="font-size:11px;color:var(--muted)">${u.lastSeen||''}</div></div>`).join('')||'Нет пользователей'}</div>`;
  }
  if(currentTab==='users'){
    wrap.innerHTML=`<div style="font-weight:800;margin-bottom:12px">Пользователи • ${users.length}</div>${users.map(u=>`<div class="row"><div><div style="font-weight:600">${u.name}</div><div style="font-size:11px;color:var(--muted)">${u.email}</div></div><div style="display:flex;gap:6px"><span class="badge b-${u.role}">${u.role}</span></div></div>`).join('')}`;
  }
  if(currentTab==='schedule'){
    wrap.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><div style="font-weight:800">Расписание</div><button class="btn primary" onclick="document.getElementById('modalSched').style.display='flex'">+ Урок</button></div><div style="display:flex;gap:6px;overflow-x:auto">${DAYS.map(d=>`<button class="btn ${activeDay===d?'primary':''}" onclick="activeDay='${d}';renderPage()">${d}</button>`).join('')}</div><div style="margin-top:12px">${schedule.filter(s=>s.day===activeDay).map(s=>`<div class="row"><div><div style="font-size:11px;color:var(--muted)">${s.time}</div><div style="font-weight:700">${s.subject}</div></div></div>`).join('')||'Нет занятий'}</div>`;
  }
  if(currentTab==='homework'){wrap.innerHTML=`<div style="font-weight:800;margin-bottom:12px">Домашние задания</div>${homework.map(h=>`<div class="row"><div><div style="font-weight:700">${h.subject}</div><div style="font-size:13px">${h.task}</div></div></div>`).join('')||'Нет заданий'}`;}
  if(currentTab==='chat'){wrap.innerHTML=`<div class="card" style="height:60vh;display:flex;flex-direction:column"><div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px">${messages.map(m=>`<div style="padding:8px 12px;border:1px solid var(--border);border-radius:12px;font-size:13px"><b>${m.user||''}</b> ${m.text}</div>`).join('')}</div></div>`;}
  page.appendChild(wrap); if(window.lucide) lucide.createIcons();
}
window.addSched=async()=>{const sc={id:Date.now().toString(),day:$('mDay').value,time:$('mTime').value,subject:$('mSubj').value,teacher:$('mTeacher').value,room:$('mRoom').value,color:'#16a34a'};if(!sc.subject) return;schedule.push(sc);renderPage();$('modalSched').style.display='none';try{await api.post({action:'save_schedule',schedule:sc});}catch(e){}};
(function(){
  if(window.innerWidth>900){sideOpen=true; const sEl=$('side'); if(sEl) sEl.classList.add('open');}
  const sel=$('mDay'); if(sel) sel.innerHTML=DAYS.map(d=>`<option>${d}</option>`).join('');
  loadData();
  if(window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
