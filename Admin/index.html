<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaClass Admin • Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#16a34a;--primary-light:#22c55e;--primary-soft:#dcfce7}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes petalFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(400px) rotate(360deg) translateX(60px);opacity:0}}
@keyframes leafFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:.8}100%{transform:translateY(450px) rotate(720deg) translateX(-40px);opacity:0}}
@keyframes snowFall{0%{transform:translateY(-20px) translateX(0);opacity:0}10%{opacity:1}100%{transform:translateY(500px) translateX(20px);opacity:0}}
@keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* AUTH GATE - НОВОЕ */
#authGate{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% -10%, #dcfce7 0%, transparent 60%), radial-gradient(1000px 500px at 90% 110%, #bbf7d0 0%, transparent 60%), linear-gradient(135deg,#0f172a 0%, #14532d 55%, #16a34a 100%);overflow:hidden;transition:opacity .5s ease, transform .5s ease}
#authGate.hide{opacity:0;pointer-events:none;transform:scale(1.02);visibility:hidden}
.auth-bg-shapes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.auth-shape{position:absolute;border-radius:50%;filter:blur(20px);opacity:.5}
.auth-card{position:relative;z-index:2;width:100%;max-width:380px;margin:16px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.5) inset;animation:scaleIn .5s cubic-bezier(.34,1.56,.64,1)}
.auth-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:0 8px 20px rgba(22,163,74,.35);margin:0 auto 14px}
.auth-title{font-family:Manrope,sans-serif;font-weight:800;font-size:26px;text-align:center;letter-spacing:-.8px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;font-weight:500}
.auth-form{margin-top:22px;display:grid;gap:12px}
.auth-input-wrap{position:relative}
.auth-input{width:100%;padding:14px 44px 14px 14px;border:1.5px solid var(--border);border-radius:14px;background:#fff;outline:none;font-size:15px;font-weight:600;letter-spacing:.3px;transition:all .2s}
.auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.auth-input.error{border-color:#ef4444;box-shadow:0 0 0 4px #fee2e2;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.auth-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);border-radius:10px}
.auth-eye:hover{background:var(--bg)}
.auth-btn{width:100%;padding:13px 16px;border-radius:14px;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(22,163,74,.35);transition:all .2s;margin-top:4px}
.auth-btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(22,163,74,.4)}
.auth-btn:disabled{opacity:.6;pointer-events:none}
.auth-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
.auth-error{font-size:12px;color:#ef4444;background:#fef2f2;border:1px solid #fecaca;padding:10px 12px;border-radius:10px;display:none;align-items:center;gap:8px;font-weight:600}
.auth-error.show{display:flex}
.auth-footer{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:11px;color:var(--muted)}

#loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;transition:opacity .7s ease;overflow:hidden}
#loader.hide{opacity:0;pointer-events:none;visibility:hidden}
.welcome-title{font-family:Manrope,sans-serif;font-weight:800;font-size:42px;letter-spacing:-1.5px}
.welcome-sub{font-weight:600;font-size:14px;opacity:.92;margin-top:8px}
.loader-bar{margin-top:26px;width:260px;height:5px;background:rgba(255,255,255,.25);border-radius:100px;overflow:hidden}
.loader-progress{height:100%;width:0%;background:#fff;border-radius:100px;transition:width .5s;position:relative;box-shadow:0 0 12px rgba(255,255,255,.6)}
.loader-progress::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:shimmer 1.2s infinite}
.loader-regular{background:linear-gradient(135deg,#16a34a,#22c55e,#4ade80)}
.loader-spring{background:linear-gradient(135deg,#16a34a,#4ade80,#bbf7d0)}
.loader-summer{background:linear-gradient(135deg,#f59e0b,#fbbf24,#fde68a)}
.loader-autumn{background:linear-gradient(135deg,#9a3412,#ea580c,#fb923c,#fed7aa)}
.loader-winter{background:linear-gradient(135deg,#0c4a6e,#0ea5e9,#7dd3fc,#e0f2fe)}
.top{position:fixed;top:0;left:0;right:0;height:62px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
.burger{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s}
.burger:hover{transform:scale(1.06)}
.layout{display:flex;min-height:100vh;padding-top:62px}
.side{position:fixed;left:0;top:62px;bottom:0;width:290px;background:var(--card);border-right:1px solid var(--border);padding:14px;overflow-y:auto;z-index:30;transition:transform .35s}
.side.closed{transform:translateX(-100%)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(6px);z-index:25;display:none}.overlay.show{display:block}
.nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;transition:all .25s;position:relative;overflow:hidden}
.nav-btn.active{background:var(--text);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.12)}
body.season-winter .nav-btn::after{content:'❄';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0;transition:all .3s}
body.season-winter .nav-btn:hover::after, body.season-winter .nav-btn.active::after{opacity:.7}
.main{margin-left:290px;flex:1;padding:20px;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;animation:fadeIn .5s ease}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;align-items:center;background:var(--card)}
.btn{padding:10px 14px;border-radius:11px;border:1px solid var(--border);background:var(--card);font-weight:600;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-color:var(--primary)}
.btn-icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-icon.danger{color:#ef4444;background:#fef2f2}
.btn-icon.view{color:#16a34a;background:#f0fdf4}
.input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);outline:none;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}
.modal-card{width:100%;max-width:440px;background:var(--card);border-radius:18px;padding:18px;max-height:90vh;overflow-y:auto;animation:scaleIn .4s cubic-bezier(.34,1.56,.64,1)}
.season-card{padding:14px;border-radius:14px;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.season-card.active{border-color:var(--text);background:var(--text);color:#fff}
.save-all-btn{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;padding:10px 18px;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(22,163,74,.3);transition:all .2s}
.save-all-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(22,163,74,.4)}
.save-all-btn.saving{opacity:.7;pointer-events:none}
.save-all-btn.saved{background:linear-gradient(135deg,#0f172a,#1e293b)}
.save-status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-status.dot::before{content:'';width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#globalToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10000;background:var(--text);color:#fff;padding:14px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.2);display:none;align-items:center;gap:10px;animation:fadeIn .3s ease}
#globalToast.show{display:flex}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:translateX(0)}.main{margin-left:0}}
</style>
</head>
<body>

<!-- НОВЫЙ ЭКРАН ВХОДА -->
<div id="authGate">
  <div class="auth-bg-shapes">
    <div class="auth-shape" style="width:300px;height:300px;background:#22c55e;left:-80px;top:-60px;animation:float 6s ease-in-out infinite"></div>
    <div class="auth-shape" style="width:400px;height:400px;background:#86efac;right:-120px;bottom:-100px;animation:float 8s ease-in-out infinite reverse"></div>
    <div class="auth-shape" style="width:200px;height:200px;background:#4ade80;left:40%;top:60%;animation:float 7s ease-in-out infinite"></div>
  </div>
  <div class="auth-card">
    <div class="auth-logo">N</div>
    <div class="auth-title">NovaClass Admin</div>
    <div class="auth-sub">Введите пароль для доступа к админке</div>
    
    <form class="auth-form" onsubmit="return handleAuth(event)">
      <div class="auth-error" id="authError"><i data-lucide="alert-circle" style="width:16px;height:16px"></i><span id="authErrorText">Неверный пароль</span></div>
      <div class="auth-input-wrap">
        <input id="authPass" type="password" class="auth-input" placeholder="Пароль доступа" autocomplete="current-password" autofocus>
        <button type="button" class="auth-eye" onclick="togglePass()" tabindex="-1"><i data-lucide="eye" id="eyeIcon" style="width:18px;height:18px"></i></button>
      </div>
      <button class="auth-btn" id="authBtn" type="submit"><i data-lucide="log-in" style="width:16px;height:16px"></i> Войти в админку</button>
      <div class="auth-hint">Доступ только для администрации • 5 сезонов</div>
    </form>

    <div class="auth-footer"><i data-lucide="shield-check" style="width:12px;height:12px"></i> Защищено • NovaClass 2026</div>
  </div>
</div>

<div id="loader" class="loader-regular">
  <div id="loaderAnim" style="position:absolute;inset:0;overflow:hidden;pointer-events:none"></div>
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center">
    <div class="welcome-title">NovaClass Admin</div>
    <div class="welcome-sub" id="loaderSub">Загрузка • 5 сезонов</div>
    <div class="loader-bar"><div class="loader-progress" id="loaderProgress"></div></div>
    <div style="margin-top:14px;font-size:11px;opacity:.85" id="loaderDetails">Подготовка админки...</div>
  </div>
</div>

<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="burger" onclick="toggleSide()"><i data-lucide="menu" style="width:18px;height:18px"></i></button><div style="width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">N</div><div style="font-weight:800">Админка • Загрузка</div><div id="seasonBadge" style="padding:4px 10px;border-radius:100px;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:700">Обычный</div></div><div style="display:flex;align-items:center;gap:10px"><div style="font-size:11px;color:var(--muted)" id="saveStatus"><i data-lucide="cloud" style="width:12px;height:12px"></i> Авто</div><button class="btn" style="padding:6px 10px;font-size:11px" onclick="logout()"><i data-lucide="log-out" style="width:12px;height:12px"></i> Выйти</button></div></div>
<div class="overlay" id="overlay" onclick="toggleSide()"></div>
<div class="layout">
<aside class="side" id="side"><div id="nav"></div></aside>
<main class="main"><div id="page"></div></main>
</div>

<div id="globalToast"><i data-lucide="check-circle" style="width:16px;height:16px"></i><span id="toastText"></span></div>

<div id="modalSched" class="modal"><div class="modal-card"><div style="font-weight:700;margin-bottom:12px"><i data-lucide="calendar" style="width:14px;height:14px"></i> Урок</div><div style="display:grid;gap:10px"><select id="mDay" class="input"></select><input id="mTime" class="input" placeholder="08:00-08:45"><input id="mSubj" class="input" placeholder="Предмет"><input id="mTeacher" class="input" placeholder="Учитель"><input id="mRoom" class="input" placeholder="Кабинет"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="closeModal('modalSched')">Отмена</button><button class="btn primary" style="flex:1" onclick="saveSched()">Сохранить</button></div></div></div>
<div id="modalHw" class="modal"><div class="modal-card"><div style="font-weight:700;margin-bottom:12px"><i data-lucide="book-open" style="width:14px;height:14px"></i> ДЗ</div><div style="display:grid;gap:10px"><select id="hwDay" class="input"></select><input id="hwSubject" class="input" placeholder="Предмет"><textarea id="hwTask" class="input" placeholder="Задание"></textarea><input id="hwDeadline" class="input" placeholder="Срок"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="closeModal('modalHw')">Отмена</button><button class="btn primary" style="flex:1" onclick="saveHw()">Сохранить</button></div></div></div>
<div id="modalEditUser" class="modal"><div class="modal-card"><div style="font-weight:700;margin-bottom:12px"><i data-lucide="user-cog" style="width:14px;height:14px"></i> Пользователь</div><div style="display:grid;gap:10px"><input id="euName" class="input" placeholder="Имя"><input id="euEmail" class="input" disabled><select id="euRole" class="input"></select></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="closeModal('modalEditUser')">Отмена</button><button class="btn primary" style="flex:1" onclick="saveUser()">Сохранить</button></div></div></div>
<div id="modalEvent" class="modal"><div class="modal-card"><div style="font-weight:700;margin-bottom:12px"><i data-lucide="megaphone" style="width:14px;height:14px"></i> Объявление</div><div style="display:grid;gap:10px"><input id="evTitle" class="input" placeholder="Заголовок"><input id="evSub" class="input" placeholder="Текст"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="closeModal('modalEvent')">Отмена</button><button class="btn primary" style="flex:1" onclick="saveEvent()">Сохранить</button></div></div></div>
<div id="modalPreview" class="modal"><div class="modal-card" style="max-width:600px;width:95%"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-weight:700" id="previewName">Превью</div><button class="btn" onclick="closeModal('modalPreview')"><i data-lucide="x" style="width:14px;height:14px"></i></button></div><div id="previewContent"></div></div></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzIHwTxKCJUpZUuqJd0-QHJ-tjTx3CCIDEyvzpZVCxYWkcYprY1Wp723J5jP9s_PA/exec';
const ADMIN_PASSWORD='Novaclass2026';
const $=id=>document.getElementById(id);
let users=[],schedule=[],homework=[],messages=[],siteSettings=null,currentTab='overview',activeDay='Понедельник',sideOpen=false,editingSchedId=null,editingHwId=null,editingUserId=null;
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const ROLES={student:'Ученик',starosta:'Староста',teacher:'Учитель',moderator:'Модератор',curator:'Куратор',admin:'Администратор',creator:'Создатель',director:'Директор'};
const ROLE_ORDER=['student','starosta','teacher','moderator','curator','admin','creator','director'];
const SEASONS={
  regular:{id:'regular',name:'Обычный',icon:'layout',color:'#16a34a',light:'#4ade80',bg:'#f8fafc',loaderClass:'loader-regular',text:'Основной',desc:'Основной'},
  spring:{id:'spring',name:'Весенний',icon:'flower-2',color:'#16a34a',light:'#86efac',bg:'#f0fdf4',loaderClass:'loader-spring',text:'Весна',desc:'Весна'},
  summer:{id:'summer',name:'Летний',icon:'sun',color:'#f59e0b',light:'#fcd34d',bg:'#fffbeb',loaderClass:'loader-summer',text:'Лето',desc:'Лето'},
  autumn:{id:'autumn',name:'Осенний',icon:'leaf',color:'#ea580c',light:'#fdba74',bg:'#fff7ed',loaderClass:'loader-autumn',text:'Осень',desc:'Осень'},
  winter:{id:'winter',name:'Зимний',icon:'snowflake',color:'#0ea5e9',light:'#7dd3fc',bg:'#f0f9ff',loaderClass:'loader-winter',text:'Зима',desc:'Зима'}
};
function getTodayDayName(){const js=new Date().getDay();const map={1:'Понедельник',2:'Вторник',3:'Среда',4:'Четверг',5:'Пятница',6:'Суббота',0:'Воскресенье'};return map[js]||'Понедельник';}
let todayDay=getTodayDayName();

/* ===== НОВАЯ ЛОГИКА ВХОДА ===== */
function togglePass(){
  const input=$('authPass');
  const icon=$('eyeIcon');
  if(input.type==='password'){input.type='text'; if(icon) icon.setAttribute('data-lucide','eye-off');}
  else {input.type='password'; if(icon) icon.setAttribute('data-lucide','eye');}
  if(window.lucide) lucide.createIcons();
}
function showAuthError(msg){
  const err=$('authError'); const txt=$('authErrorText'); const input=$('authPass');
  if(txt) txt.textContent=msg;
  if(err) err.classList.add('show');
  if(input){input.classList.add('error'); input.focus(); setTimeout(()=>input.classList.remove('error'),600);}
}
function handleAuth(e){
  e.preventDefault();
  const input=$('authPass'); const btn=$('authBtn');
  const val=(input.value||'').trim();
  if(!val){showAuthError('Введите пароль'); return false;}
  if(val!==ADMIN_PASSWORD){showAuthError('Неверный пароль • Попробуйте: Novaclass2026'); if(window.lucide) lucide.createIcons(); return false;}

  // Успех
  btn.innerHTML='<i data-lucide="loader-2" style="width:16px;height:16px;animation:spin 1s linear infinite"></i> Вход...';
  if(window.lucide) lucide.createIcons();
  localStorage.setItem('novaclass_admin_auth','1');
  localStorage.setItem('novaclass_admin_auth_time', Date.now().toString());
  
  setTimeout(()=>{
    const gate=$('authGate');
    if(gate) gate.classList.add('hide');
    // Запускаем загрузку данных только после входа
    initAfterAuth();
  }, 500);
  return false;
}
function logout(){
  localStorage.removeItem('novaclass_admin_auth');
  localStorage.removeItem('novaclass_admin_auth_time');
  location.reload();
}
function checkAuthOnStart(){
  const auth=localStorage.getItem('novaclass_admin_auth');
  // Автовыход через 12 часов
  const t=parseInt(localStorage.getItem('novaclass_admin_auth_time')||'0',10);
  if(auth==='1' && t && (Date.now()-t) < 12*3600*1000){
    const gate=$('authGate');
    if(gate) gate.classList.add('hide');
    return true;
  }
  return false;
}
function initAfterAuth(){
  loadSeasonForLoader();
  loadData();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>{ if(window.lucide) lucide.createIcons(); if(!checkAuthOnStart()){ $('authPass')?.focus(); } else { initAfterAuth(); } });}
else { if(!checkAuthOnStart()){ setTimeout(()=>$('authPass')?.focus(),100); } else { initAfterAuth(); } }

class Api{async get(a,p={}){let qs=new URLSearchParams(Object.assign({action:a},p)).toString();let r=await fetch(GAS_URL+'?'+qs,{cache:'no-store'});if(!r.ok) throw new Error('Сеть '+r.status);let j=await r.json();if(j.status==='error') throw new Error(j.message);return j;}async post(d){let r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)});if(!r.ok) throw new Error('Сеть '+r.status);let j=await r.json();if(j.status==='error') throw new Error(j.message);return j;}}
const api=new Api();
function toggleSide(){sideOpen=!sideOpen;$('side').classList.toggle('open',sideOpen);$('side').classList.toggle('closed',!sideOpen);$('overlay').classList.toggle('show',sideOpen); if(window.lucide) lucide.createIcons();}
function closeModal(id){const el=$(id);if(!el) return;el.classList.remove('show');el.style.display='none';}
function openModal(id){const el=$(id);if(!el) return;el.style.display='flex';el.classList.add('show'); if(window.lucide) lucide.createIcons();}
function getDefaultSettings(){return {enabled:true,maintenance_msg:'Техработы',global_banner:null,blocked_users:[],season:{mode:'auto',current:'regular',customColors:{regular:{primary:'#16a34a',light:'#4ade80',bg:'#f8fafc'},spring:{primary:'#16a34a',light:'#86efac',bg:'#f0fdf4'},summer:{primary:'#f59e0b',light:'#fcd34d',bg:'#fffbeb'},autumn:{primary:'#ea580c',light:'#fdba74',bg:'#fff7ed'},winter:{primary:'#0ea5e9',light:'#7dd3fc',bg:'#f0f9ff'}},banners:{}}};}

function createWowLoader(season){
  const loader=$('loader');const anim=$('loaderAnim');const sub=$('loaderSub');const details=$('loaderDetails');
  if(!loader||!anim) return;
  loader.className='';loader.id='loader';loader.classList.add(season.loaderClass);
  if(sub) sub.textContent=season.text+' • Загрузка';
  anim.innerHTML='';
  if(season.id==='regular'){if(details) details.textContent='Обычный • Загрузка';}
  if(season.id==='spring'){if(details) details.textContent='Весна • Загрузка'; for(let i=0;i<14;i++){const p=document.createElement('div');p.style.cssText='position:absolute;left:'+(5+i*7)+'%;top:-20px;background:linear-gradient(135deg,#f9a8d4,#f472b6);border-radius:50% 0 50% 0;width:'+(8+Math.random()*10)+'px;height:'+(8+Math.random()*10)+'px;animation:petalFall '+(4+Math.random()*3)+'s linear infinite;animation-delay:'+(Math.random()*2)+'s';anim.appendChild(p);}}
  if(season.id==='summer'){if(details) details.textContent='Лето • Загрузка'; const sun=document.createElement('div');sun.style.cssText='position:absolute;width:120px;height:120px;background:radial-gradient(circle,#fef3c7,#fbbf24);border-radius:50%;left:50%;top:20%;transform:translateX(-50%);box-shadow:0 0 40px rgba(251,191,36,.6)';anim.appendChild(sun);}
  if(season.id==='autumn'){if(details) details.textContent='Осень • Загрузка'; for(let i=0;i<15;i++){const leaf=document.createElement('div');leaf.textContent=['🍂','🍁','🍃'][i%3];leaf.style.cssText='position:absolute;left:'+(Math.random()*100)+'%;top:-30px;font-size:'+(14+Math.random()*12)+'px;animation:leafFall '+(5+Math.random()*4)+'s linear infinite;animation-delay:'+(Math.random()*3)+'s';anim.appendChild(leaf);}}
  if(season.id==='winter'){if(details) details.textContent='Зима • Загрузка'; for(let i=0;i<26;i++){const snow=document.createElement('div');snow.textContent='❄';snow.style.cssText='position:absolute;left:'+(Math.random()*100)+'%;top:-20px;font-size:'+(8+Math.random()*16)+'px;color:rgba(255,255,255,'+(0.5+Math.random()*0.5)+');animation:snowFall '+(6+Math.random()*4)+'s linear infinite;animation-delay:'+(Math.random()*4)+'s';anim.appendChild(snow);}}
}

function getSeasonByDate(){const m=new Date().getMonth(); if([2,3,4].includes(m)) return SEASONS.spring; if([5,6,7].includes(m)) return SEASONS.summer; if([8,9,10].includes(m)) return SEASONS.autumn; if([11,0,1].includes(m)) return SEASONS.winter; return SEASONS.regular;}
function loadSeasonForLoader(){
  try{
    const raw=localStorage.getItem('nc_site_settings');
    let cur=getSeasonByDate();
    if(raw){const s=JSON.parse(raw); if(s.season&&s.season.current&&SEASONS[s.season.current]&&s.season.mode==='manual') cur=SEASONS[s.season.current];}
    document.body.classList.remove('season-regular','season-spring','season-summer','season-autumn','season-winter');
    document.body.classList.add('season-'+cur.id);
    createWowLoader(cur);
    const badge=$('seasonBadge'); if(badge) badge.textContent=cur.name;
  }catch{createWowLoader(getSeasonByDate());}
}

async function loadData(){
  const loader=$('loader');const progress=$('loaderProgress');
  loadSeasonForLoader();
  let pct=0; const interval=setInterval(()=>{pct=Math.min(pct+6,90); if(progress) progress.style.width=pct+'%';},180);
  try{
    const data=await api.get('getAllData');
    users=data.users||[]; schedule=data.schedule||[]; homework=data.homework||[]; messages=data.messages||[];
    if(data.settings){const ctrl=data.settings.find(s=>s.key==='site_control'); if(ctrl){try{siteSettings=JSON.parse(ctrl.value); localStorage.setItem('nc_site_settings',ctrl.value); loadSeasonForLoader();}catch{siteSettings=getDefaultSettings();}}else siteSettings=getDefaultSettings();}
    if(data.events&&data.events.length) localStorage.setItem('main_event',JSON.stringify({title:data.events[0].title,sub:data.events[0].sub}));
    if(progress) progress.style.width='100%';
  }catch(e){try{const c=localStorage.getItem('admin_cache'); if(c){const d=JSON.parse(c); users=d.users||[]; schedule=d.schedule||[]; homework=d.homework||[]; messages=d.messages||[];}}catch{} if(!siteSettings) siteSettings=getDefaultSettings();}
  clearInterval(interval);
  setTimeout(()=>{if(loader) loader.classList.add('hide');},2000);
  renderNav(); renderPage(); if(window.lucide) lucide.createIcons();
}

function renderNav(){
  const tabs=[
    {id:'overview',label:'Обзор',icon:'layout-dashboard'},
    {id:'users',label:'Пользователи',icon:'users'},
    {id:'schedule',label:'Расписание',icon:'calendar-days'},
    {id:'homework',label:'ДЗ',icon:'book-open'},
    {id:'chat',label:'Чат',icon:'message-circle'},
    {id:'event',label:'Объявления',icon:'megaphone'},
    {id:'seasons',label:'Сезоны + ',icon:'palette'},
    {id:'control',label:'Управление',icon:'settings'}
  ];
  $('nav').innerHTML=tabs.map(t=>`<button class="nav-btn ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')"><i data-lucide="${t.icon}" style="width:16px;height:16px"></i> ${t.label} ${t.id==='users'?`(${users.length})`:''}</button>`).join('');
  if(window.lucide) lucide.createIcons();
}
window.switchTab=(id)=>{currentTab=id;renderNav();renderPage(); if(window.innerWidth<=900) toggleSide();}

  if(currentTab==='homework'){page.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-weight:700">ДЗ • ${homework.length} • Сегодня ${todayDay}</div><button class="btn primary" onclick="openHwModal()"><i data-lucide="plus" style="width:14px;height:14px"></i> Задание</button></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${DAYS.map(d=>{const isToday=d===todayDay; return `<button class="btn ${activeDay===d?'primary':''}" onclick="activeDay='${d}';renderPage()">${d}${isToday?' • Сегодня':''}</button>`;}).join('')}</div><div>${homework.filter(h=>h.day===activeDay).map(h=>`<div class="row"><div><div style="font-weight:600">${h.subject}</div><div style="font-size:12px">${h.task}</div><div style="font-size:11px;color:var(--muted)">${h.deadline||''}</div></div><div style="display:flex;gap:6px"><button class="btn-icon" onclick="editHw('${h.id}')"><i data-lucide="pencil" style="width:12px;height:12px"></i></button><button class="btn-icon danger" onclick="deleteHw('${h.id}')"><i data-lucide="trash-2" style="width:12px;height:12px"></i></button></div></div>`).join('')||'<div class="card" style="text-align:center;color:var(--muted)">Нет ДЗ на '+activeDay+'</div>'}</div>`;}
  if(currentTab==='chat'){page.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-weight:700">Чат • ${messages.length}</div><button class="btn danger" onclick="clearChat()"><i data-lucide="trash-2" style="width:12px;height:12px"></i> Очистить</button></div><div>${messages.slice(-30).map(m=>`<div class="row"><div style="flex:1"><div style="font-size:13px">${(m.text||'').slice(0,150)}</div><div style="font-size:11px;color:var(--muted)">${m.user} • ${m.time||''}</div></div><button class="btn-icon danger" onclick="deleteMsg('${m.id}')"><i data-lucide="x" style="width:12px;height:12px"></i></button></div>`).join('')||'<div class="card" style="text-align:center;color:var(--muted)">Нет сообщений</div>'}</div>`;}
  if(currentTab==='event'){const ev=JSON.parse(localStorage.getItem('main_event')||'null'); page.innerHTML=`<div class="card"><div style="font-weight:700"><i data-lucide="megaphone" style="width:16px;height:16px"></i> Объявление</div><div style="margin-top:10px;padding:12px;background:var(--bg);border-radius:12px"><div style="font-weight:600">${ev?ev.title:'Нет объявления'}</div><div style="font-size:12px;color:var(--muted)">${ev?ev.sub:''}</div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" onclick="openModal('modalEvent')"><i data-lucide="pencil" style="width:12px;height:12px"></i> Изменить</button><button class="btn" onclick="clearEvent()"><i data-lucide="trash-2" style="width:12px;height:12px"></i> Удалить</button></div></div>`;}
    if(currentTab==='seasons'){
    const s=siteSettings||getDefaultSettings(); const cfg=s.season;
    page.innerHTML=`<div class="card"><div style="font-weight:700;display:flex;align-items:center;gap:8px"><i data-lucide="palette" style="width:16px;height:16px"></i> Сезоны • Сегодня ${todayDay}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">5 сезонов: Обычный, Весенний, Летний, Осенний, Зимний. Каждый со своей -загрузкой. Авто по дате или ручной выбор.</div>
    <div style="margin-top:12px"><div style="font-weight:600;font-size:13px">Режим</div><div style="display:flex;gap:8px;margin-top:6px"><button class="btn ${cfg.mode==='auto'?'primary':''}" onclick="setSeasonMode('auto')"><i data-lucide="clock" style="width:12px;height:12px"></i> Авто по дате</button><button class="btn ${cfg.mode==='manual'?'primary':''}" onclick="setSeasonMode('manual')"><i data-lucide="hand" style="width:12px;height:12px"></i> Ручной</button></div></div>
    ${cfg.mode==='manual'?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px">${Object.values(SEASONS).map(se=>`<div class="season-card ${cfg.current===se.id?'active':''}" onclick="setCurrentSeason('${se.id}')"><div style="display:flex;align-items:center;gap:6px;font-weight:600"><i data-lucide="${se.icon}" style="width:14px;height:14px"></i> ${se.name}</div><div style="font-size:10px;opacity:.8;margin-top:4px">${se.text}</div></div>`).join('')}</div>`:''}
    <button class="btn primary" style="width:100%;margin-top:14px;justify-content:center" onclick="saveSettings()"><i data-lucide="save" style="width:14px;height:14px"></i> Сохранить</button></div>`;
  }
  if(currentTab==='control'){const s=siteSettings||getDefaultSettings(); page.innerHTML=`<div class="card"><div style="font-weight:700"><i data-lucide="settings" style="width:16px;height:16px"></i> Управление • Сегодня ${todayDay} • ${new Date().toLocaleDateString('ru-RU')}</div><div style="margin-top:12px"><div style="font-size:12px;font-weight:600">Сообщение при техработах</div><input id="maintMsg" class="input" value="${s.maintenance_msg||''}" style="margin-top:4px"></div><div style="margin-top:10px"><div style="font-size:12px;font-weight:600">Баннер</div><input id="bannerMsg" class="input" value="${s.global_banner||''}" style="margin-top:4px"></div><button class="btn primary" style="width:100%;margin-top:12px;justify-content:center" onclick="saveControl()"><i data-lucide="save" style="width:12px;height:12px"></i> Сохранить</button></div>`;}
  if(window.lucide) lucide.createIcons();

function renderUsersHTML(q){
  const filter=(q||'').toLowerCase(); 
  const list=users.filter(u=>!filter||u.name.toLowerCase().includes(filter)||u.email.toLowerCase().includes(filter)); 
  if(!list.length) return '<div class="card" style="text-align:center;color:var(--muted);padding:32px"><i data-lucide="users" style="width:32px;height:32px;opacity:.3;margin-bottom:8px"></i><div>Нет пользователей</div><div style="font-size:11px;margin-top:4px">Попробуйте изменить поиск</div></div>'; 
  return list.map(u=>`
    <div class="row" style="flex-wrap:wrap">
      <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:200px">
        <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(22,163,74,.2)">${u.name[0].toUpperCase()}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.name}</div>
          <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.email}</div>
          <div style="margin-top:4px;display:flex;gap:6px;align-items:center">
            <span style="padding:3px 8px;border-radius:100px;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:700">${ROLES[u.role]||u.role}</span>
            <span style="font-size:10px;color:var(--muted)">ID: ${u.id.slice(0,8)}...</span>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
        <select class="input" style="width:150px;padding:6px 10px;font-size:12px;font-weight:600" onchange="quickChangeRole('${u.id}', this.value)" title="Быстро изменить обязанность">
          ${ROLE_ORDER.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${ROLES[r]}</option>`).join('')}
        </select>
        <div style="display:flex;gap:6px">
          <button class="btn-icon view" onclick="viewUser('${u.id}')" title="Просмотр"><i data-lucide="eye" style="width:14px;height:14px"></i></button>
          <button class="btn-icon" onclick="editUser('${u.id}')" title="Изменить имя и обязанность"><i data-lucide="pencil" style="width:14px;height:14px"></i></button>
          <button class="btn-icon danger" onclick="deleteUser('${u.id}')" title="Удалить"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
        </div>
      </div>
    </div>
  `).join('');
}
window.renderUsers=(q)=>{const el=$('userList'); if(el){el.innerHTML=renderUsersHTML(q); if(window.lucide) lucide.createIcons();}}
window.viewUser=(id)=>{const u=users.find(x=>x.id==id); if(!u) return; $('previewName').textContent=u.name+' • '+u.email; $('previewContent').innerHTML=`<div class="card"><div style="font-size:13px">Email: ${u.email}<br>Роль: ${ROLES[u.role]||u.role}<br>ID: ${u.id}</div></div>`; openModal('modalPreview');}
window.openSchedModal=()=>{editingSchedId=null;$('mDay').value=activeDay;$('mTime').value='';$('mSubj').value='';$('mTeacher').value='';$('mRoom').value='';openModal('modalSched');}
window.editSched=(id)=>{const s=schedule.find(x=>x.id==id); if(!s) return; editingSchedId=id;$('mDay').value=s.day;$('mTime').value=s.time;$('mSubj').value=s.subject;$('mTeacher').value=s.teacher;$('mRoom').value=s.room; openModal('modalSched');}
window.saveSched=()=>{const data={day:$('mDay').value,time:$('mTime').value.trim(),subject:$('mSubj').value.trim(),teacher:$('mTeacher').value.trim(),room:$('mRoom').value.trim()}; if(!data.subject||!data.time){alert('Заполните');return;} if(editingSchedId){const idx=schedule.findIndex(x=>x.id==editingSchedId); if(idx>=0) schedule[idx]={...schedule[idx],...data}; api.post({action:'save_schedule',schedule:schedule[idx]}).then(()=>{showToast('Урок обновлен и сохранен в таблицу'); setSaveBtnState('saved');}).catch(()=>{});}else{const sc={id:Date.now().toString(),...data}; schedule.push(sc); api.post({action:'save_schedule',schedule:sc}).then(()=>{showToast('Новый урок добавлен и сохранен'); setSaveBtnState('saved');}).catch(()=>{});} closeModal('modalSched'); renderPage();}
window.deleteSched=(id)=>{if(!confirm('Удалить?')) return; schedule=schedule.filter(x=>x.id!=id); api.post({action:'delete_schedule',id}).catch(()=>{}); renderPage();}
window.openHwModal=()=>{editingHwId=null;$('hwDay').value=activeDay;$('hwSubject').value='';$('hwTask').value='';$('hwDeadline').value=''; openModal('modalHw');}
window.editHw=(id)=>{const h=homework.find(x=>x.id==id); if(!h) return; editingHwId=id;$('hwDay').value=h.day;$('hwSubject').value=h.subject;$('hwTask').value=h.task;$('hwDeadline').value=h.deadline; openModal('modalHw');}
window.saveHw=()=>{const data={day:$('hwDay').value,subject:$('hwSubject').value.trim(),task:$('hwTask').value.trim(),deadline:$('hwDeadline').value.trim()}; if(!data.subject||!data.task){alert('Заполните');return;} if(editingHwId){const idx=homework.findIndex(x=>x.id==editingHwId); if(idx>=0) homework[idx]={...homework[idx],...data}; api.post({action:'save_homework',homework:homework[idx]}).catch(()=>{});}else{const nh={id:Date.now().toString(),...data}; homework.push(nh); api.post({action:'save_homework',homework:nh}).catch(()=>{});} closeModal('modalHw'); renderPage();}
window.deleteHw=(id)=>{if(!confirm('Удалить?')) return; homework=homework.filter(x=>x.id!=id); api.post({action:'delete_homework',id}).catch(()=>{}); renderPage();}
window.editUser=(id)=>{
  const u=users.find(x=>x.id==id); 
  if(!u) {showToast('Пользователь не найден', true); return;} 
  editingUserId=id;
  $('euName').value=u.name;
  $('euEmail').value=u.email;
  $('euRole').innerHTML=ROLE_ORDER.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${ROLES[r]} — ${r}</option>`).join('');
  const modal=$('modalEditUser');
  if(modal){
    const oldHead=modal.querySelector('.personal-header');
    if(oldHead) oldHead.remove();
    const card=modal.querySelector('.modal-card');
    if(card){
      const head=document.createElement('div');
      head.className='personal-header';
      head.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)';
      head.innerHTML=`<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">${u.name[0].toUpperCase()}</div><div><div style="font-weight:700">${u.name}</div><div style="font-size:11px;color:var(--muted)">${u.email} • Сейчас: ${ROLES[u.role]||u.role}</div></div>`;
      card.prepend(head);
    }
  }
  openModal('modalEditUser');
};
window.saveUser=()=>{
  const u=users.find(x=>x.id==editingUserId); 
  if(!u) return; 
  const name=$('euName').value.trim(),role=$('euRole').value; 
  if(!name) {showToast('Введите имя', true); return;} 
  const oldRole=u.role;
  u.name=name; 
  u.role=role; 
  setSaveBtnState('saving');
  api.post({action:'update_user',id:u.id,name,role,email:u.email})
    .then(()=>{
      setSaveBtnState('saved');
      showToast(`Обязанность изменена: ${u.name} теперь ${ROLES[role]} • Было: ${ROLES[oldRole]||oldRole}`);
      if('Notification' in window && Notification.permission==='granted'){
        new Notification(`Обязанность изменена • ${u.name}`, {body:`${ROLES[oldRole]||oldRole} → ${ROLES[role]} • Сохранено в таблицу`});
      }
    })
    .catch(e=>{
      setSaveBtnState('saved');
      showToast('Ошибка сохранения: '+e.message, true);
      u.role=oldRole;
    }); 
  closeModal('modalEditUser'); 
  renderPage();
};
window.quickChangeRole=(id, newRole)=>{
  const u=users.find(x=>x.id==id);
  if(!u) return;
  if(u.role===newRole) return;
  const oldRole=u.role;
  const oldName=u.name;
  if(!confirm(`Изменить обязанность для ${u.name}?\n${ROLES[oldRole]||oldRole} → ${ROLES[newRole]||newRole}`)) {
    renderPage();
    return;
  }
  u.role=newRole;
  renderPage();
  setSaveBtnState('saving');
  api.post({action:'update_user',id:u.id,name:u.name,role:newRole,email:u.email})
    .then(()=>{
      setSaveBtnState('saved');
      showToast(`Быстро изменено: ${oldName} теперь ${ROLES[newRole]} • Сохранено`);
    })
    .catch(e=>{
      u.role=oldRole;
      renderPage();
      showToast('Ошибка: '+e.message, true);
      setSaveBtnState('saved');
    });
};
window.deleteUser=(id)=>{if(!confirm('Удалить?')) return; users=users.filter(x=>x.id!=id); api.post({action:'delete_user',id}).catch(()=>{}); renderPage();}
window.deleteMsg=(id)=>{messages=messages.filter(x=>x.id!=id); api.post({action:'delete_message',id}).catch(()=>{}); renderPage();}
window.clearChat=()=>{if(!confirm('Очистить чат?')) return; messages=[]; api.post({action:'clear_chat'}).catch(()=>{}); renderPage();}
window.saveEvent=()=>{const t=$('evTitle').value.trim(),s=$('evSub').value.trim(); if(!t) return; localStorage.setItem('main_event',JSON.stringify({title:t,sub:s})); api.post({action:'save_event',title:t,sub:s}).catch(()=>{}); closeModal('modalEvent'); renderPage();}
window.clearEvent=()=>{localStorage.removeItem('main_event'); api.post({action:'delete_event'}).catch(()=>{}); renderPage();}
window.setSeasonMode=(m)=>{if(!siteSettings.season) siteSettings.season=getDefaultSettings().season; siteSettings.season.mode=m; renderPage();}
window.setCurrentSeason=(id)=>{if(!siteSettings.season) siteSettings.season=getDefaultSettings().season; siteSettings.season.current=id; renderPage();}
function showToast(text, isError=false){
  const toast=$('globalToast');
  const txt=$('toastText');
  if(!toast||!txt) return;
  txt.textContent=text;
  toast.classList.add('show');
  toast.style.background=isError?'#ef4444':'var(--text)';
  setTimeout(()=>{toast.classList.remove('show');}, 3000);
  if(window.lucide) lucide.createIcons();
}
function setSaveBtnState(state){
  const btn=$('saveAllBtn');
  const status=$('saveStatus');
  if(!btn) return;
  if(state==='saving'){
    btn.classList.add('saving');
    btn.innerHTML='<i data-lucide="loader-2" style="width:14px;height:14px;animation:spin 1s linear infinite"></i> Сохранение...';
    if(status) status.innerHTML='<i data-lucide="loader-2" style="width:12px;height:12px;animation:spin 1s linear infinite"></i> Сохранение...';
  } else if(state==='saved'){
    btn.classList.remove('saving');
    btn.classList.add('saved');
    btn.innerHTML='<i data-lucide="check" style="width:14px;height:14px"></i> Сохранено ✓';
    if(status) status.innerHTML='<i data-lucide="check" style="width:12px;height:12px;color:#22c55e"></i> Все сохранено • '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' • Персонально';
    setTimeout(()=>{btn.classList.remove('saved'); btn.innerHTML='<i data-lucide="save" style="width:14px;height:14px"></i> Сохранить всё'; if(window.lucide) lucide.createIcons();}, 2500);
  } else {
    btn.classList.remove('saving','saved');
    btn.innerHTML='<i data-lucide="save" style="width:14px;height:14px"></i> Сохранить всё';
    if(status) status.innerHTML='<i data-lucide="cloud" style="width:12px;height:12px"></i> Автосохранение';
  }
  if(window.lucide) lucide.createIcons();
}
window.saveAllData=async()=>{
  setSaveBtnState('saving');
  try{
    if(siteSettings){ await api.post({action:'save_settings',settings:siteSettings}); }
    for(let s of schedule){ await api.post({action:'save_schedule',schedule:s}).catch(()=>{}); }
    for(let h of homework){ await api.post({action:'save_homework',homework:h}).catch(()=>{}); }
    localStorage.setItem('admin_cache', JSON.stringify({users,schedule,homework,messages,settings:siteSettings}));
    localStorage.setItem('nc_site_settings', JSON.stringify(siteSettings));
    setSaveBtnState('saved');
    showToast(`Все данные сохранены! ${schedule.length} уроков, ${homework.length} заданий, ${users.length} пользователей • Персонально`);
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('NovaClass Admin • Сохранено', {body:`Все изменения сохранены в таблицу • ${new Date().toLocaleTimeString()}`});
    }
  }catch(e){
    setSaveBtnState('saved');
    showToast('Ошибка: '+e.message, true);
  }
};
window.saveSettings=()=>{
  setSaveBtnState('saving');
  api.post({action:'save_settings',settings:siteSettings}).then(()=>{
    setSaveBtnState('saved');
    showToast('Настройки сезона сохранены! Теперь у всех пользователей • Сезон: '+SEASONS[siteSettings.season.current].name);
  }).catch(e=>{
    setSaveBtnState('saved');
    showToast('Ошибка: '+e.message, true);
  });
};
window.saveControl=()=>{
  siteSettings.maintenance_msg=$('maintMsg').value; 
  siteSettings.global_banner=$('bannerMsg').value||null; 
  saveSettings();
};
window.saveEvent=()=>{
  const t=$('evTitle').value.trim(),s=$('evSub').value.trim(); 
  if(!t) {showToast('Введите заголовок', true); return;}
  localStorage.setItem('main_event',JSON.stringify({title:t,sub:s})); 
  setSaveBtnState('saving');
  api.post({action:'save_event',title:t,sub:s}).then(()=>{
    setSaveBtnState('saved');
    showToast(`Объявление "${t}" сохранено и показано всем ученикам`);
  }).catch(e=>{
    setSaveBtnState('saved');
    showToast('Ошибка: '+e.message, true);
  });
  closeModal('modalEvent'); 
  renderPage();
};
(function(){const sel=$('mDay'); if(sel) sel.innerHTML=DAYS.map(d=>`<option>${d}</option>`).join(''); const sel2=$('hwDay'); if(sel2) sel2.innerHTML=DAYS.map(d=>`<option>${d}</option>`).join(''); if(window.lucide) lucide.createIcons();})();
